name: live-repro

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4

      - name: Checkout untrusted PR head to pr-head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head

      - name: Run Claude Code Action
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          prompt: "Say hello."
          anthropic_api_key: "dummy"
          github_token: ${{ github.token }}
          claude_args: "--add-dir pr-head --debug-file /tmp/claude-debug.txt"

      - name: Show hook proof
        if: always()
        run: |
          if [ -f /tmp/plugin-hook-proof.txt ]; then
            sed -n '1,200p' /tmp/plugin-hook-proof.txt
          else
            echo "NO_PLUGIN_HOOK_PROOF"
          fi

      - name: Show Claude debug
        if: always()
        run: |
          if [ -f /tmp/claude-debug.txt ]; then
            sed -n '1,260p' /tmp/claude-debug.txt
          else
            echo "NO_CLAUDE_DEBUG_FILE"
          fi
